
services:
  db:
    profiles: [local-db]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memori
      POSTGRES_PASSWORD: memori
      POSTGRES_DB: memori
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memori"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    network_mode: ${API_NETWORK_MODE:-bridge}
    env_file: .env
    depends_on:
      redis: { condition: service_started }
    ports:
      - "9001:8000"
    volumes:
      - ${WORKSPACE_HOST_PATH:-../}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKSPACE_ROOT: /workspace
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SCHEMA: ${DB_SCHEMA:-agent}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      SUPABASE_POOLER_HOST: ${SUPABASE_POOLER_HOST:-aws-0-ap-southeast-1.pooler.supabase.com}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}
    command: >
      sh -c "if [ -n \"$$SUPABASE_ANON_KEY\" ]; then
        echo 'Using Supabase REST API — skipping local alembic';
      elif echo \"$$DATABASE_URL\" | grep -qi supabase; then
        echo 'Using Supabase Postgres URL — skipping local alembic';
      else
        for i in $$(seq 1 30); do python -c \"import socket; s=socket.create_connection(('host.docker.internal',5433),2); s.close()\" 2>/dev/null && break; sleep 1; done;
        timeout 90 alembic upgrade head || echo 'migration skipped';
      fi;
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: ""
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}

volumes:
  pgdata:
