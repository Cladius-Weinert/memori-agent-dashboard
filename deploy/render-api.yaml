# Opsora API — Render Blueprint (API only, permanent backend)
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → connect repo
services:
  - type: web
    name: opsora-api
    runtime: docker
    dockerfilePath: deploy/Dockerfile.api
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opsora-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: opsora-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: MOBILE_ACCESS_TOKEN_EXPIRE_DAYS
        value: "90"
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: CORS_ORIGINS
        value: "*"
      - key: OPSORA_PERMANENT_GATEWAY
        value: https://mwbgkkthwwlcndccnbnf.supabase.co/functions/v1/opsora-api
      - key: LLM_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: redis
    name: opsora-redis
    plan: starter
    region: singapore
    ipAllowList: []

databases:
  - name: opsora-db
    plan: starter
    region: singapore
    databaseName: memori
    user: memori
