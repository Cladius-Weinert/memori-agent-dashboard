<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Opsora Logo — Abstract orbital "O" with terminal node -->
  <!-- Hexagonal orbit ring -->
  <path d="M60 12 L100 35 L100 85 L60 108 L20 85 L20 35 Z" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linejoin="round" opacity="0.3"/>
  <!-- Inner orbit (rotated) -->
  <path d="M60 24 L90 42 L90 78 L60 96 L30 78 L30 42 Z" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-linejoin="round" opacity="0.15"/>
  <!-- Connection lines from center -->
  <line x1="60" y1="60" x2="60" y2="12" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="60" x2="100" y2="35" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="60" x2="100" y2="85" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="60" x2="60" y2="108" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="60" x2="20" y2="85" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="60" x2="20" y2="35" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
  <!-- Outer nodes -->
  <circle cx="60" cy="12" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="100" cy="35" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="100" cy="85" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="60" cy="108" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="20" cy="85" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="20" cy="35" r="3" fill="#8b5cf6" opacity="0.5"/>
  <!-- Central core -->
  <circle cx="60" cy="60" r="12" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="60" cy="60" r="8" fill="#8b5cf6" opacity="0.15"/>
  <circle cx="60" cy="60" r="4" fill="#8b5cf6"/>
  <!-- Terminal cursor blink -->
  <rect x="56" y="54" width="2" height="12" fill="#8b5cf6" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
